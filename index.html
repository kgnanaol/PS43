<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>PS43 Cameroon Crossover – Cameroon Infrastructure Portal</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap"
    />
    <style>
      /* Colour tokens: one light theme (gold page, cream cards, navy text, green header). */
      :root {
        --bg: #fdbb2f;
        --sf: #fff8ea;
        --tx: #002d62;
        --mu: #335781;
        --ln: #dbe3df;
        --gr: #007a5e;
        --grs: #e0f2ec;
        --go: #fdbb2f;
        --gos: #fdf1d3;
        --nv: #002d62;
        --nvs: #e1e8f2;
        --rd: #ce1126;
        --rds: #fbe3e6;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      * {
        box-sizing: border-box;
      }
      html {
        color-scheme: light;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--tx);
        font:
          15px/1.5 Arial,
          Helvetica,
          sans-serif;
      }
      h1,
      h2,
      h3 {
        font-family: Oswald, "Arial Narrow", Impact, sans-serif;
        text-transform: uppercase;
        letter-spacing: 0.02em;
        margin: 0;
        font-weight: 700;
      }
      button,
      select,
      input,
      textarea {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      :focus-visible {
        outline: 3px solid var(--go);
        outline-offset: 2px;
      }
      header {
        background: #007a5e;
        color: #fff;
        padding: 14px 16px;
      }
      .wrap {
        max-width: 1100px;
        margin: 0 auto;
      }
      .top {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .logo {
        height: 56px;
        width: auto;
        flex: none;
      }
      .top h1 {
        font-size: 26px;
        line-height: 1.1;
      }
      .top small {
        display: block;
        opacity: 0.85;
        font: 400 13px Arial;
        text-transform: none;
        letter-spacing: 0;
      }
      .ctl {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      select,
      input[type="text"],
      input[type="number"],
      input[type="search"],
      input[type="email"],
      textarea {
        border: 1px solid var(--ln);
        border-radius: 8px;
        padding: 8px 10px;
        background: var(--sf);
        font-weight: 400;
      }
      header select {
        border: 0;
        color: #21141b;
        background: #fff;
      }
      .kpis {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 10px;
        margin-top: 14px;
      }
      .kpi {
        background: rgba(255, 255, 255, 0.14);
        border-radius: 10px;
        padding: 8px 12px;
      }
      .kpi b {
        font:
          700 28px Oswald,
          Impact,
          sans-serif;
        display: block;
        line-height: 1.1;
      }
      .kpi span {
        font-size: 12px;
      }
      /* Layout and components */
      nav {
        background: var(--sf);
        border-bottom: 1px solid var(--ln);
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        z-index: 5;
      }
      nav .wrap {
        display: flex;
        gap: 4px;
        overflow-x: auto;
        padding: 0 8px;
      }
      nav button {
        background: none;
        border: 0;
        border-bottom: 3px solid transparent;
        padding: 12px 14px;
        white-space: nowrap;
        color: var(--mu);
        font-weight: 700;
      }
      nav button[aria-selected="true"] {
        color: var(--gr);
        border-color: var(--gr);
      }
      main {
        padding: 18px 16px 60px;
      }
      .sec {
        display: none;
      }
      .sec.on {
        display: block;
      }
      .bar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 14px;
      }
      .bar input {
        flex: 1 1 200px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
        gap: 14px;
      }
      .card {
        background: var(--sf);
        border: 1px solid var(--ln);
        border-radius: 12px;
        padding: 14px;
      }
      .card h3 {
        font-size: 18px;
        margin-bottom: 2px;
      }
      .mu {
        color: var(--mu);
        font-size: 15px;
      }
      .b {
        display: inline-block;
        font-size: 12px;
        font-weight: 700;
        border-radius: 99px;
        padding: 2px 9px;
        margin: 2px 3px 2px 0;
      }
      .ok {
        background: #cce4df;
        color: var(--gr);
      }
      .wn {
        background: #feebc1;
        color: #8a5a00;
      }
      .er {
        background: #f5cfd3;
        color: var(--rd);
      }
      .nt {
        background: #ccd5e0;
        color: var(--nv);
      }
      .btn {
        border: 0;
        border-radius: 8px;
        padding: 8px 12px;
        font-weight: 700;
        background: var(--gr);
        color: #fff;
      }
      .btn.alt {
        background: var(--nvs);
        color: var(--nv);
      }
      .btn.gh {
        background: none;
        border: 1px solid var(--ln);
        color: var(--tx);
      }
      .btn.sm {
        padding: 5px 9px;
        font-size: 13px;
      }
      .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
      }
      .cols {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 16px;
      }
      form label,
      .f {
        display: block;
        font-weight: 700;
        font-size: 13px;
        margin: 10px 0 3px;
      }
      form input[type="text"],
      form input[type="number"],
      form input[type="email"],
      form select,
      form textarea {
        width: 100%;
      }
      label.chk {
        display: inline-flex;
        gap: 6px;
        align-items: center;
        margin: 3px 12px 3px 0;
        font-weight: 400;
        font-size: 14px;
      }
      .sub {
        margin: 2px 0 6px 22px;
        padding-left: 10px;
        border-left: 3px solid var(--grs);
      }
      [hidden] {
        display: none !important;
      }
      .tog {
        display: flex;
        gap: 6px;
        margin-bottom: 12px;
      }
      .tog .btn {
        flex: 1;
      }
      .sw {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-weight: 700;
      }
      #mapbox {
        background: var(--sf);
        border: 1px solid var(--ln);
        border-radius: 12px;
        padding: 10px;
        margin-bottom: 14px;
        display: grid;
        grid-template-columns: minmax(200px, 320px) 1fr;
        gap: 16px;
        align-items: center;
      }
      #mapbox svg {
        width: 100%;
        height: auto;
        max-height: 460px;
      }
      #mapbox [data-s],
      #mapbox [data-q] {
        cursor: pointer;
      }
      @media (max-width: 640px) {
        #mapbox {
          grid-template-columns: 1fr;
        }
      }
      /* SMS simulator */
      .phone {
        max-width: 340px;
        margin: 0 auto;
        border: 8px solid #14211c;
        border-radius: 28px;
        background: var(--sf);
        overflow: hidden;
      }
      #sl {
        height: 340px;
        overflow-y: auto;
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        background: var(--bg);
      }
      .bub {
        padding: 8px 11px;
        border-radius: 14px;
        max-width: 85%;
        font-size: 14px;
        word-break: break-word;
      }
      .bub.u {
        align-self: flex-end;
        background: var(--gr);
        color: #fff;
      }
      .bub.s {
        align-self: flex-start;
        background: var(--sf);
        border: 1px solid var(--ln);
      }
      #smsf {
        display: flex;
        gap: 6px;
        padding: 8px;
        border-top: 1px solid var(--ln);
      }
      #smsf input {
        flex: 1;
        min-width: 0;
      }
      /* Pop-up and toast */
      dialog {
        border: 0;
        border-radius: 14px;
        padding: 20px;
        max-width: min(520px, 94vw);
        width: 100%;
        background: var(--sf);
        color: var(--tx);
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
      }
      dialog::backdrop {
        background: rgba(0, 0, 0, 0.5);
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: calc(20px + env(safe-area-inset-bottom, 0px));
        transform: translate(-50%, 30px);
        background: var(--nv);
        color: #fff;
        padding: 10px 16px;
        border-radius: 10px;
        opacity: 0;
        transition: 0.25s;
        z-index: 20;
        pointer-events: none;
        max-width: 92vw;
      }
      #toast.on {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      h2 {
        font-size: 22px;
        margin-bottom: 10px;
        color: var(--gr);
      }
      .note {
        background: var(--gos);
        border-radius: 10px;
        padding: 10px 12px;
        margin-bottom: 14px;
        font-size: 14px;
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>

   Keep the function names and data shapes below and everything else keeps working.

   RECORD SHAPES
   school  = { id, region, name, address, students, phone, email,
               needs: { infrastructure: [roofing, flooring, walls],
                        supplies:       [notebooks, textbooks, writing],
                        technology:     [electricity, internet, devices] },
               subjects: [science, math, engineering, arts, technology],

               status: 'open' | 'matched', partnerId, ll: [lon, lat] (optional) }
   partner = { id, region, name, address, phone, email, website,
               offers: { structure:  [roofing, flooring, walls],
                         supplies:   [notebooks, textbooks, pens],
                         technology: [electricity, internet] },
               subjects: [...or 'all'], capacity, why,
               verified: true | false, done, ll: [lon, lat] (optional) }

   (Adamawa, Centre, East, Far North, Littoral, North, Northwest, South, Southwest, West)

   COMMENT STYLE
   Public functions use a short REQUIRES / MODIFIES / EFFECTS contract:
     REQUIRES  what must be true before the call (JavaScript does not enforce this).
     MODIFIES  what state the call changes ("nothing" if it only reads).
     EFFECTS   what the call does and returns, assuming REQUIRES holds.

   PUBLIC API (used by index.html)
     PS43.schools() / PS43.partners()     -> arrays
     PS43.store(kind, record)             -> saves a 'school' or 'partner' record, returns it
     PS43.match(school)                   -> { partner, covered: [...], gaps: [...] } or null
     PS43.confirmMatch(schoolId, partnerId), PS43.verify(partnerId), PS43.reset()
   ===================================================================== */

         * EFFECTS:  returns a new array of Partner objects (each has .ref pointing to its full partner record),
         *           verified partners first, so they win when several partners could fill a need.
         */
        const listings = () =>
          D.partners
            .slice()
            .sort((a, b) => b.verified - a.verified)
            .flatMap((p) =>
              Object.entries(p.offers).map(([c, subs]) =>
                Object.assign(new Partner(p.name, p.region, SPEC[c], subs), {
                  ref: p,
                }),
              ),
            );
        /**
         * The core matching rule: same region, same specialty, and the partner covers EVERY requested sub-need.
         * REQUIRES: sRegion is a region code; sSpec is 'infrastructure' | 'supplies' | 'technology';
         *           sSub is an array of sub-needs (an empty array means "any partner offering this category").
         * MODIFIES: nothing.
         * EFFECTS:  returns the first matching Partner listing (verified first), or null if none exists.
         */
        function matchOne(sRegion, sSpec, sSub) {
          for (const p of listings()) {
            if (
              p.region === sRegion &&
              p.spec === sSpec &&
              sSub.every((x) => p.subSpec.includes(x))
            )
              return p;
          }
          return null;
        }

        window.PS43 = {
          /**
           * schools() / partners()
           * REQUIRES: nothing.   MODIFIES: nothing.
           * EFFECTS:  returns the live arrays (not copies). Callers should read them, and change data only through the functions below.
           */
          schools: () => D.schools,
          partners: () => D.partners,
          /**
           * Saves a new school request or partner sign-up.
           * REQUIRES: kind is 'school' or 'partner'; rec has the matching shape (see top of file) with a valid region code.
           *           No validation is done here; the form checks required fields.
           * MODIFIES: D (in memory), localStorage, and rec itself (id, status / verified / done are set).
           * EFFECTS:  appends rec to D.schools (status 'open') or D.partners (unverified, done = 0). Returns rec.
           */
          store(kind, rec) {
            rec.id = Date.now() + Math.floor(Math.random() * 1000);
            if (kind === "school") {
              rec.status = "open";
              D.schools.push(rec);
            } else {
              rec.verified = false;
              rec.done = 0;
              D.partners.push(rec);
            }
            save();
            return rec;
          },
          /**
           * Finds the best partner for a school request.
           * REQUIRES: s is a school record with a region code and a non-empty s.needs.
           * MODIFIES: nothing.
           * EFFECTS:  returns null if no partner in the school's region covers at least one requested need.
           *           Otherwise returns { partner, covered, gaps }:
           *             partner - the partner record covering the most requested needs (verified partners win ties)
           *             covered - requested sub-needs that partner offers (or the category name if the school listed no sub-needs)
           *             gaps    - requested sub-needs that partner does NOT offer
           *           Rule: a partner who covers a whole category is used first. If none does, sub-needs are matched one at a time.
           */
          match(s) {
            // hits: partner record -> list of requested needs it covers
            const hits = new Map(),
              add = (p, l) => hits.set(p, (hits.get(p) || []).concat(l));
            for (const c in s.needs) {
              // Strict rule first: one partner that covers the whole category
              const subs = s.needs[c],
                p = matchOne(s.region, c, subs);
              if (p) add(p.ref, subs.length ? subs : [c]);
              // Fallback: cover the sub-needs one at a time (they may be different partners)
              else
                subs.forEach((x) => {
                  const q = matchOne(s.region, c, [x]);
                  if (q) add(q.ref, [x]);
                });
            }
            // Pick the partner that covers the most needs; verified partners get a +0.5 tiebreak
            let best = null;
            hits.forEach((cov, p) => {
              if (
                !best ||
                cov.length + (p.verified ? 0.5 : 0) >
                  best.covered.length + (best.partner.verified ? 0.5 : 0)
              )
                best = { partner: p, covered: cov };
            });
            if (!best) return null;
            // gaps = everything requested that the chosen partner does not cover
            const want = Object.entries(s.needs).flatMap(([c, l]) =>
              l.length ? l : [c],
            );
            best.gaps = want.filter((x) => !best.covered.includes(x));
            return best;
          },
          /**
           * Records that a school has been matched with a partner.
           * REQUIRES: sid and pid are ids of an existing school and partner (the partner is not checked).
           * MODIFIES: D, localStorage.
           * EFFECTS:  sets the school's status to 'matched' and its partnerId. Does nothing if the school is not found.
           */
          confirmMatch(sid, pid) {
            const s = D.schools.find((x) => x.id === sid);
            if (s) {
              s.status = "matched";
              s.partnerId = pid;
              save();
            }
          },
          /**
           * Marks a partner as PS43-verified.
           * REQUIRES: pid is the id of an existing partner.
           * MODIFIES: D, localStorage.
           * EFFECTS:  sets partner.verified = true. Does nothing if the partner is not found.
           */
          verify(pid) {
            const p = D.partners.find((x) => x.id === pid);
            if (p) {
              p.verified = true;
              save();
            }
          },
          /**
           * Restores the sample data.
           * REQUIRES: nothing.
           * MODIFIES: D, localStorage.
           * EFFECTS:  replaces all schools and partners with a fresh copy of SEED.
           */
          reset() {
            D = clone(SEED);
            save();
          },
        };
      })();

              if (m === null) body += `<p class="mu">${T("nomatch")}</p>`;
              else if (m)
                body += `<div style="margin-top:8px"><b>${esc(m.partner.name)}</b>${m.partner.verified ? ` <span class="b ok">${T("ver")}</span>` : ""}<div>${(m.covered || []).length ? `<span class="mu">${T("cov")}:</span> ${chips(m.covered, "ok")}` : ""}</div><div>${(m.gaps || []).length ? `<span class="mu">${T("gap")}:</span> ${chips(m.gaps, "er")}` : ""}</div><button class="btn alt sm" data-cm="${s.id},${m.partner.id}">${T("confirm")}</button></div>`;
            }
            return `<article class="card"><h3>${esc(s.name)}</h3><div class="mu">${RG[s.region][L]}</div><div>${chips(flat(s.needs))}</div>${body}</article>`;
          })
          .join("");
      }
      // partnersv(): draws the partner cards.
      function partnersv() {
        $("#partners").innerHTML = P()
          .map(
            (p) =>
              `<article class="card"><h3>${esc(p.name)}</h3><div class="mu">${esc(p.address || "")} · ${RG[p.region][L]}${p.capacity ? " · " + p.capacity + " " + T("stu") : ""}</div><div><span class="b ${p.verified ? "ok" : "wn"}">${T(p.verified ? "ver" : "pen")}</span><span class="b nt">${p.done} ${T("done")}</span></div><div>${chips(flat(p.offers))}</div>${p.subjects && p.subjects.length ? `<div class="mu">${p.subjects.map(T).join(", ")}</div>` : ""}${!p.verified && persona === "admin" ? `<button class="btn alt sm" data-v="${p.id}" style="margin-top:8px">${T("verify")}</button>` : ""}</article>`,
          )
          .join("");
      }
      // queuev(): draws the offline sync queue and the Online/Offline badge.
      function queuev() {
        $("#qb").textContent = Q.length + " " + T("k_q").toLowerCase();
        $("#queue").innerHTML = Q.length
          ? Q.map(
              (x) =>
                `<div style="padding:6px 0;border-top:1px solid var(--ln)">${esc(x.rec.name)}<br><span class="mu">${T(x.kind === "school" ? "f_school" : "f_partner")}</span></div>`,
            ).join("")
          : T("empty");
        $("#net").className = "b " + (off ? "er" : "ok");
        $("#net").textContent = T(off ? "off" : "on");
      }
      // smsv(): draws the SMS simulator chat.
      function smsv() {
        $("#sl").innerHTML = SMS.map(
          (m) => `<div class="bub ${m.f}">${esc(m.t)}</div>`,
        ).join("");
        $("#sl").scrollTop = 1e5;
      }
      // ===== Forms =====
      // fld(): one labelled form field. formHTML(kind): builds the school or partner form.
      function fld(k, i, req) {
        return `<label>${T(k)}${req ? " *" : ""}${i}</label>`;
      }
      function formHTML(kind) {
        const sc = kind === "school",
          c = CATS[kind];
        const need = Object.entries(c)
          .map(
            ([k, l]) =>
              `<div><label class="chk"><input type="checkbox" data-cat="${k}"> <b>${T(k)}</b></label><div class="sub" data-subs="${k}" hidden>${l.map((s) => `<label class="chk"><input type="checkbox" data-sub="${k}" value="${s}"> ${T(s)}</label>`).join("")}</div></div>`,
          )
          .join("");
        const subj = `<div data-sj hidden><span class="f">${T(sc ? "subjects" : "subjects2")}</span>${SUBJ.concat(
          sc ? [] : ["all"],
        )
          .map(
            (s) =>
              `<label class="chk"><input type="checkbox" data-sj value="${s}"> ${T(s)}</label>`,
          )
          .join("")}</div>`;
        const ct = `<span class="f">${T("contactq")}</span><label class="chk"><input type="checkbox" name="ctok"> ${T("tickc")}</label><div class="sub" data-ct hidden>${fld("role", `<select name="role">${["teacher", "principal", "staff", "oth"].map((r) => `<option>${T(r)}</option>`).join("")}</select>`)}${fld("yname", '<input type="text" name="cname">')}${fld("phone", '<input type="text" name="cphone">')}${fld("email", '<input type="email" name="cemail">')}</div>`;
        return `<form class="card" data-k="${kind}" ${kind === fk ? "" : "hidden"}>${fld(
          "region",
          `<select name="region" required><option value="">${T("selreg")}</option>${Object.keys(
            RG,
          )
            .map((k) => `<option value="${k}">${RG[k][L]}</option>`)
            .join("")}</select>`,
          1,
        )}
${fld(sc ? "sname" : "name", '<input type="text" name="name" required>', 1)}${fld("address", '<input type="text" name="address" required>', 1)}${sc ? fld("students", '<input type="number" name="students" min="1" required>', 1) : fld("phone", '<input type="text" name="phone" required>', 1)}
${sc ? fld("phone", '<input type="text" name="phone">') : fld("email", '<input type="email" name="email">')}${sc ? fld("email", '<input type="email" name="email">') : fld("website", '<input type="text" name="website">')}
<span class="f">${T(sc ? "need" : "offers")} *</span>${need}${subj}${sc ? "" : `<div data-cp hidden>${fld("cap", '<input type="number" name="capacity" min="0">')}</div>`}
${sc ? ct + fld("other", '<textarea name="comments" rows="2"></textarea>') : fld("why", '<input type="text" name="why" required>', 1) + fld("other", '<textarea name="comments" rows="2"></textarea>')}
<p class="mu">${T("consent")}</p><button class="btn">${T("submit")}</button></form>`;
      }
      // forms(): (re)builds both forms. Note: this clears anything typed, so avoid calling it while someone is filling in a form.
      function forms() {
        $("#forms").innerHTML = formHTML("school") + formHTML("partner");
        document.querySelectorAll("#forms form").forEach(sync);
        document
          .querySelectorAll("[data-fk]")
          .forEach((b) => b.classList.toggle("alt", b.dataset.fk !== fk));
      }
      // sync(form): shows or hides the follow-up questions (sub-options, subject, capacity, contact) based on what is ticked.
      function sync(f) {
        const k = f.dataset.k,
          on = [...f.querySelectorAll("[data-cat]")]
            .filter((c) => c.checked)
            .map((c) => c.dataset.cat);
        f.querySelectorAll("[data-subs]").forEach(
          (d) => (d.hidden = !on.includes(d.dataset.subs)),
        );
        const sj = f.querySelector("[data-sj]");
        sj.hidden = !SJ[k].some((c) => on.includes(c));
        const cp = f.querySelector("[data-cp]");
        if (cp) cp.hidden = !CP.some((c) => on.includes(c));
        const ct = f.querySelector("[data-ct]");
        if (ct) ct.hidden = !f.ctok.checked;
      }
      // collect(form): reads a form into a record in the shape script.js expects.
      function collect(f) {
        const k = f.dataset.k,
          g = (n) => (f[n] ? f[n].value : ""),
          needs = {};
        f.querySelectorAll("[data-cat]:checked").forEach(
          (c) =>
            (needs[c.dataset.cat] = [
              ...f.querySelectorAll(`[data-sub="${c.dataset.cat}"]:checked`),
            ].map((x) => x.value)),
        );
        const sj = f.querySelector("[data-sj]").hidden
            ? []
            : [...f.querySelectorAll("[data-sj]:checked")]
                .map((x) => x.value)
                .filter((x) => x),
          r = {
            region: g("region"),
            name: g("name"),
            address: g("address"),
            phone: g("phone"),
            email: g("email"),
            subjects: sj,
            comments: g("comments"),
          };
        if (k === "school") {
          r.students = +g("students");
          r.needs = needs;
          r.contact = f.ctok.checked
            ? {
                ok: true,
                role: g("role"),
                name: g("cname"),
                phone: g("cphone"),
                email: g("cemail"),
              }
            : { ok: false };
        } else {
          r.website = g("website");
          r.offers = needs;
          r.capacity = +g("capacity") || 0;
          r.why = g("why");
        }
        return r;
      }
      // ===== SMS simulator =====
      // sendSms(text): reads "PS43 <REGION> <STUDENTS> <need,need> <School name>", saves it with PS43.store, and adds a reply.
      function sendSms(t) {
        SMS.push({ f: "u", t });
        const w = t.trim().split(/\s+/),
          ok =
            w[0] &&
            w[0].toUpperCase() === "PS43" &&
            RG[(w[1] || "").toUpperCase()] &&
            +w[2] > 0 &&
            w[3] &&
            w[4];
        let reply = T("smsbad");
        if (ok) {
          const subs = w[3]
            .toLowerCase()
            .split(",")
            .filter((x) => SUBCAT[x]);
          if (subs.length) {
            const needs = {};
            subs.forEach((x) =>
              (needs[SUBCAT[x]] = needs[SUBCAT[x]] || []).push(x),
            );
            const rec = PS43.store("school", {
              region: w[1].toUpperCase(),
              name: w.slice(4).join(" "),
              address: "SMS",
              students: +w[2],
              needs,
              subjects: [],
              contact: { ok: false },
              comments: "Received by SMS",
            });
            reply = `${T("smsok")} “${rec.name}”, ${RG[rec.region][L]}, ${rec.students} ${T("stu")}: ${subs.map(T).join(", ")}. Ref #${String(rec.id).slice(-5)}`;
            toast(T("t_sub"));
          }
        }
        SMS.push({ f: "s", t: reply });
        all();
      }
      // ===== Pop-ups and page refresh =====
      // open(html): shows the shared pop-up window.
      function open(h) {
        const d = $("#dlg");
        d.innerHTML =
          h +
          `<div style="margin-top:14px;text-align:right"><button class="btn gh" data-x>${T("close")}</button></div>`;
        d.showModal();
      }
      // all(): redraws everything. Called after any change.
      function all() {
        stat();
        tabs();
        mapv();
        matchv();
        partnersv();
        queuev();
        smsv();
      }
      // ===== Events =====
      // One click handler for every button. Each button carries a data-* attribute that says what it does:
      // data-t tab, data-d school details, data-fk switch form, data-fm find match, data-all match all, data-cm confirm match,
      // data-v verify partner, data-ex SMS example, data-reset reset demo, data-x close pop-up.
      document.addEventListener("click", (e) => {
        const el = e.target.closest("[data-s],[data-q]");
        if (el && !e.target.closest("button")) {
          const s = el.dataset.s ? +el.dataset.s : 0;
          return el.dataset.s ? detail(+el.dataset.s) : detailP(+el.dataset.q);
        }
        const b = e.target.closest("button");
        if (!b) return;
        const D = b.dataset;
        if ("x" in D) return $("#dlg").close();
        if (D.t) {
          tab = D.t;
          return all();
        }
        if (D.d) return detail(+D.d);
        if (D.pd) return detailP(+D.pd);
        if (D.fk) {
          fk = D.fk;
          return forms();
        }
        if (D.fm) {
          MR[D.fm] = PS43.match(S().find((s) => s.id === +D.fm));
          return matchv();
        }
        if ("all" in D) {
          S()
            .filter((s) => s.status !== "matched")
            .forEach((s) => (MR[s.id] = PS43.match(s)));
          return matchv();
        }
        if (D.cm) {
          const [s, p] = D.cm.split(",").map(Number);
          PS43.confirmMatch(s, p);
          delete MR[s];
          all();
          return toast(T("t_cm"));
        }
        if (D.v) {
          PS43.verify(+D.v);
          all();
          return toast(T("t_v"));
        }
        if ("ex" in D) {
          $("#smsin").value =
            "PS43 NWR 240 roofing,internet Bamenda Primary School";
          return $("#smsin").focus();
        }
        if ("reset" in D) {
          PS43.reset();
          Q = [];
          MR = {};
          SMS = [];
          sv();
          all();
          forms();
        }
      });
      // detail(id) / detailP(id): pop-ups for a school / a partner.
      function detail(id) {
        const s = S().find((x) => x.id === id),
          pa = P().find((p) => p.id === s.partnerId);
        open(
          `<h3>${esc(s.name)}</h3><p class="mu">${esc(s.address || "")} · ${RG[s.region][L]} · ${s.students} ${T("stu")}</p>${Object.entries(
            s.needs,
          )
            .map(([c, l]) => `<div><b>${T(c)}:</b> ${chips(l)}</div>`)
            .join(
              "",
            )}${s.subjects && s.subjects.length ? `<p class="mu">${s.subjects.map(T).join(", ")}</p>` : ""}${s.contact && s.contact.ok ? `<p><b>${T("contact")}:</b> ${esc(s.contact.name || "")} (${esc(s.contact.role || "")}) ${esc(s.contact.phone || "")}</p>` : ""}${s.comments ? `<p>${esc(s.comments)}</p>` : ""}<span class="b ${s.status === "matched" ? "ok" : "er"}">${T(s.status === "matched" ? "l_match" : "l_open")}</span>${pa ? esc(pa.name) : ""}`,
        );
      }
      function detailP(id) {
        const p = P().find((x) => x.id === id);
        open(
          `<h3>${esc(p.name)}</h3><p class="mu">${esc(p.address || "")} · ${RG[p.region][L]}</p><span class="b ${p.verified ? "ok" : "wn"}">${T(p.verified ? "ver" : "pen")}</span><div>${chips(flat(p.offers))}</div>${p.why ? `<p>${esc(p.why)}</p>` : ""}`,
        );
      }
      // Form events: tick boxes update the follow-up questions; submit saves (or queues when "offline"); SMS form sends a text.
      document.addEventListener("change", (e) => {
        const f = e.target.closest("#forms form");
        if (f) sync(f);
      });
      document.addEventListener("submit", (e) => {
        const f = e.target;
        if (f.id === "smsf") {
          e.preventDefault();
          const v = $("#smsin").value.trim();
          if (v) {
            $("#smsin").value = "";
            sendSms(v);
          }
          return;
        }
        if (f.closest("#forms")) {
          e.preventDefault();
          const r = collect(f),
            k = f.dataset.k;
          if (!Object.keys(k === "school" ? r.needs : r.offers).length)
            return toast(T("t_need"));
          if (off) {
            Q.push({ kind: k, rec: r });
            sv();
            toast(T("t_q"));
          } else {
            PS43.store(k, r);
            toast(T("t_sub"));
          }
          f.reset();
          sync(f);
          all();
        }
      });
      ["#q", "#fr"].forEach((s) => $(s).addEventListener("input", mapv));
      // Role switch, language switch and the offline toggle (going back online syncs the queue).
      $("#persona").addEventListener("change", (e) => {
        persona = e.target.value;
        tab = TABS[persona][0];
        fk = persona === "partner" ? "partner" : "school";
        forms();
        all();
      });
      $("#lang").addEventListener("change", (e) => {
        L = +e.target.value;
        sv();
        document.documentElement.lang = L ? "fr" : "en";
        forms();
        all();
      });
      $("#off").addEventListener("change", (e) => {
        off = e.target.checked;
        if (!off && Q.length) {
          const n = Q.length;
          Q.forEach((x) => PS43.store(x.kind, x.rec));
          Q = [];
          sv();
          all();
          return toast(n + " " + T("t_sync"));
        }
        all();
      });
      // ===== Start-up =====
      $("#lang").value = L;
      SMS.push({ f: "s", t: "PS43: " + T("smsbad").split(": ")[1] });
      forms();
      all();
    </script>
  </body>
</html>
